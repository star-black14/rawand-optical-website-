<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
        }

        header {
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #292d35;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #4da3ff;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: clamp(45px, 8vw, 80px);
            margin-bottom: 20px;
        }

        .hero p {
            color: #aeb4c0;
            font-size: 20px;
            max-width: 600px;
            margin: auto;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            background: #1677ff;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .button:hover {
            background: #005edb;
        }

        section {
            padding: 70px 8%;
            text-align: center;
        }

        section h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        section p {
            color: #aeb4c0;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #292d35;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">My Website</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>

        <section class="hero" id="home">
            <div>
                <h1>Welcome</h1>

                <p>
                    Welcome to my website. This is the beginning of something amazing.
                </p>

                <a href="#about" class="button">Explore</a>
            </div>
        </section>

        <section id="about">
            <h2>About</h2>

            <p>
                This is where you can add information about your website.
            </p>
        </section>

        <section id="contact">
            <h2>Contact</h2>

            <p>
                Add your contact information here.
            </p>
        </section>

    </main>

    <footer>
        © 2026 My Website
    </footer>

</body>
</html>
